# RG AI es pública (el visitante no inicia sesión); se protege con origen permitido y límites de uso.
[functions.rg-ai]
verify_jwt = false

# notificar-cliente y crear-usuario comprueban la sesión y el rol en su propio código (panel_yo);
# la verificación antigua de Supabase rechazaría las sesiones firmadas con las claves nuevas.
[functions.notificar-cliente]
verify_jwt = false

[functions.crear-usuario]
verify_jwt = false
